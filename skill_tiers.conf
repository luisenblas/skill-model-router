# skill_tiers.conf: SKILL -> POWER BAND
# =====================================
# Declares how much power each skill needs, by band (resolved via power_map.conf).
# Add a line here for each skill you want regulated.
# Skills NOT listed are left untouched and inherit the session model.
# The names below are examples. Replace them with your own skill directory names.

# Flagship: work where quality is the point and a redo is expensive.
blog-writer     = flagship
code-architect  = flagship

# Content: high-quality but cost-sensitive or automated, bulk work.
data-enricher   = content
report-drafter  = content

# Synthesis: briefings and note-writing (regular writing and research, medium effort).
daily-briefing  = synthesis
meeting-notes   = synthesis
doc-reviewer    = synthesis

# Routine: filing, syncs, classification, planning.
inbox-triage    = routine
file-organizer  = routine

# Light: small repetitive tasks on a cheaper model.
task-sync       = light
status-update   = light
