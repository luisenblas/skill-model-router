# power_map.conf: POWER BAND -> MODEL, EFFORT
# ============================================
# This is the file you edit when the model landscape changes.
# A "band" is a power level, not a model name. Skills ask for a band
# (see skill_tiers.conf); this file decides which model + effort fills it today.
#
# Value format:  <model>[, <effort>]
#   model  - a tier alias (opus / sonnet / haiku / fable) that tracks the
#            latest model in that tier. A new Opus ships? `opus` follows it,
#            with zero edits. Use a specific id only for a tier with no alias.
#   effort - optional: low / medium / high / xhigh / max, stamped into each
#            skill's `effort:` frontmatter (overrides the session effort while
#            the skill runs). Omit to leave effort untouched.
#            Ladder: low = extraction/formatting/classification/repetitive,
#            medium = regular writing/research/docs, high = difficult
#            coding/debugging/tool-heavy, xhigh = large refactors/deep
#            investigations, max = rare last-bit-of-capability problems.
#
# To move flagship onto a pricier tier, change one line, e.g.
#   flagship = fable, high
# and rerun `python3 sync_skill_models.py`.

flagship  = opus, high
content   = opus, medium
synthesis = opus, medium
routine   = opus, low
light     = sonnet, low
fast      = haiku, low
